[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localdoctor"
version = "0.1.0"
description = "A diagnostic proxy that catches silent inference failures in local LLM servers, with evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
localdoctor = "localdoctor.cli:app"

[tool.setuptools.packages.find]
include = ["localdoctor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
